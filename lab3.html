<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giám sát người chạy</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{font-family:Arial;max-width:900px;margin:20px auto;padding:0 10px}
  .cards{display:flex;gap:12px}
  .card{flex:1;border:1px solid #ccc;border-radius:8px;padding:12px;text-align:center}
  .value{font-size:28px;font-weight:bold}
  button{padding:10px 20px;margin:6px;font-size:16px;cursor:pointer}
  #status{color:gray}
</style>
</head>
<body>
<h2>Giám sát và cảnh báo người chạy</h2>
<p id="status">Đang kết nối...</p>

<div class="cards">
  <div class="card">Nhiệt độ<div class="value"><span class="temp">--</span> °C</div></div>
  <div class="card">Áp suất<div class="value"><span class="pressure">--</span> hPa</div></div>
  <div class="card">Độ cao<div class="value"><span class="altitude">--</span> m</div></div>
</div>

<h3>Điều khiển (manual)</h3>
<button id="btnLed">LED: OFF</button>
<button id="btnBuzzer">Loa: OFF</button>

<canvas id="chartTemp" height="90"></canvas>
<canvas id="chartAlt" height="90"></canvas>

<script>
const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
const T_DATA='runner/231432217/data', T_LED='runner/231432217/led', T_BUZ='runner/231432217/buzzer';

function makeChart(id,label){
  return new Chart(document.getElementById(id),{
    type:'line',
    data:{labels:[],datasets:[{label,data:[],tension:0.3}]},
    options:{animation:false}
  });
}
const cT = makeChart('chartTemp','Nhiệt độ (°C)');
const cA = makeChart('chartAlt','Độ cao (m)');

function push(chart,val){
  chart.data.labels.push(new Date().toLocaleTimeString());
  chart.data.datasets[0].data.push(val);
  if(chart.data.labels.length>20){chart.data.labels.shift();chart.data.datasets[0].data.shift();}
  chart.update();
}

client.on('connect',()=>{
  document.getElementById('status').textContent='Đã kết nối MQTT';
  client.subscribe(T_DATA);
});

client.on('message',(topic,payload)=>{
  if(topic===T_DATA){
    const d=JSON.parse(payload.toString());
    document.querySelector('.temp').textContent=d.temp;
    document.querySelector('.pressure').textContent=d.pressure;
    document.querySelector('.altitude').textContent=d.altitude;
    push(cT,d.temp); push(cA,d.altitude);
  }
});

let led=false, buz=false;
document.getElementById('btnLed').onclick=function(){
  led=!led; client.publish(T_LED, led?'ON':'OFF');
  this.textContent='LED: '+(led?'ON':'OFF');
};
document.getElementById('btnBuzzer').onclick=function(){
  buz=!buz; client.publish(T_BUZ, buz?'ON':'OFF');
  this.textContent='Loa: '+(buz?'ON':'OFF');
};
</script>
</body>
</html>
